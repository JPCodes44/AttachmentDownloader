<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6779"/></marker></defs>
<rect width="1200" height="420" rx="20" fill="#ffffff" stroke="#d9dee7"/>
<text x="40" y="52" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#19202c" text-anchor="start">How a scan works</text>
<text x="40" y="80" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5d6779" text-anchor="start">Runs in the background on Convex, one page of emails at a time</text>
<rect x="53.0" y="150" width="190" height="104" rx="12" fill="#ffffff" stroke="#2753c9" stroke-width="2.5"/><text x="148.0" y="198.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#19202c" text-anchor="middle">Find attachments</text><text x="148.0" y="222.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">you click</text>
<path d="M247.0,202 L274.0,202" stroke="#5d6779" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="279.0" y="150" width="190" height="104" rx="12" fill="#ffffff" stroke="#d9dee7" stroke-width="1.5"/><text x="374.0" y="188.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#19202c" text-anchor="middle">Start the scan</text><text x="374.0" y="212.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">save it, queue</text><text x="374.0" y="232.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">the first run</text>
<path d="M473.0,202 L500.0,202" stroke="#5d6779" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="505.0" y="150" width="190" height="104" rx="12" fill="#ffffff" stroke="#d9dee7" stroke-width="1.5"/><text x="600.0" y="188.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#19202c" text-anchor="middle">List 100 emails</text><text x="600.0" y="212.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">Gmail search with</text><text x="600.0" y="232.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">has:attachment</text>
<path d="M699.0,202 L726.0,202" stroke="#5d6779" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="731.0" y="150" width="190" height="104" rx="12" fill="#ffffff" stroke="#d9dee7" stroke-width="1.5"/><text x="826.0" y="188.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#19202c" text-anchor="middle">Read each email</text><text x="826.0" y="212.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">8 at a time, keep</text><text x="826.0" y="232.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">parts with a filename</text>
<path d="M925.0,202 L952.0,202" stroke="#5d6779" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="957.0" y="150" width="190" height="104" rx="12" fill="#ffffff" stroke="#d9dee7" stroke-width="1.5"/><text x="1052.0" y="188.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#19202c" text-anchor="middle">Save the results</text><text x="1052.0" y="212.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">file details only,</text><text x="1052.0" y="232.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">update the counts</text>
<path d="M1052.0,254 C1052.0,340 600.0,340 600.0,260" stroke="#5d6779" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#a)"/><rect x="742.8" y="315" width="166.4" height="18" rx="4" fill="#ffffff"/><text x="826.0" y="328" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5d6779" text-anchor="middle">more emails? run again</text>
<path d="M1052.0,144 L1052.0,110" stroke="#5d6779" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="986.8" y="89" width="130.4" height="18" rx="4" fill="#ffffff"/><text x="1052.0" y="102" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5d6779" text-anchor="middle">list updates live</text>
<text x="1052.0" y="372" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f7a4d" text-anchor="middle">no more pages: done</text>
<text x="53.0" y="402" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="start">Stop button: the scan is marked cancelled, and the next run quits before saving anything.</text>
</svg>