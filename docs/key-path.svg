<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6779"/></marker></defs>
<rect width="1200" height="400" rx="20" fill="#ffffff" stroke="#d9dee7"/>
<text x="40" y="52" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#19202c" text-anchor="start">Where the Gmail key goes</text>
<text x="40" y="80" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5d6779" text-anchor="start">Google&#x27;s long-lived refresh token, from sign-in to download</text>
<rect x="53.0" y="120" width="190" height="104" rx="12" fill="#f3f5f8" stroke="#d9dee7" stroke-width="1.5"/><text x="148.0" y="158.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#19202c" text-anchor="middle">Google</text><text x="148.0" y="182.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">hands over the</text><text x="148.0" y="202.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">refresh token</text>
<path d="M247.0,172 L274.0,172" stroke="#5d6779" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="279.0" y="120" width="190" height="104" rx="12" fill="#fdf6ea" stroke="#b0731a" stroke-width="2.5"/><text x="374.0" y="158.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#19202c" text-anchor="middle">Encrypt at once</text><text x="374.0" y="182.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">AES-GCM, before</text><text x="374.0" y="202.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">any database write</text>
<path d="M473.0,172 L500.0,172" stroke="#5d6779" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="505.0" y="120" width="190" height="104" rx="12" fill="#fdf6ea" stroke="#b0731a" stroke-width="2.5"/><text x="600.0" y="158.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#19202c" text-anchor="middle">Stored encrypted</text><text x="600.0" y="182.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">gmailAccounts table,</text><text x="600.0" y="202.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">server-only</text>
<path d="M699.0,172 L726.0,172" stroke="#5d6779" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="731.0" y="120" width="190" height="104" rx="12" fill="#fdf6ea" stroke="#b0731a" stroke-width="2.5"/><text x="826.0" y="158.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#19202c" text-anchor="middle">Swap when needed</text><text x="826.0" y="182.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">for a 1-hour</text><text x="826.0" y="202.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">read-only token</text>
<path d="M925.0,172 L952.0,172" stroke="#5d6779" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="957.0" y="120" width="190" height="104" rx="12" fill="#ffffff" stroke="#d9dee7" stroke-width="1.5"/><text x="1052.0" y="158.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#19202c" text-anchor="middle">Used briefly</text><text x="1052.0" y="182.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">by scans, and by your</text><text x="1052.0" y="202.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">browser to download</text>
<rect x="53.0" y="268" width="1094" height="92" rx="12" fill="#fbe7e5" stroke="#b3261e" stroke-width="2"/><text x="600.0" y="300.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#19202c" text-anchor="middle">Never stored or sent</text><text x="600.0" y="324.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">not on your user record · not in the browser · not in GitHub or the repo</text><text x="600.0" y="344.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5d6779" text-anchor="middle">after 7 days in Google&#x27;s Testing mode it expires, and the app asks you to sign in again</text>
</svg>