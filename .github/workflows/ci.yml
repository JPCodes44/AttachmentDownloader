name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main] # a merged PR lands here: deploy to staging, then production after approval
  workflow_dispatch: # manual "deploy main" button in the Actions tab

permissions:
  contents: read

jobs:
  checks:
    name: Secret scan, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - name: Scan for committed secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner -v .

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Build
        run: bun run build
        env:
          VITE_CONVEX_URL: https://placeholder.convex.cloud

  deploy-staging:
    needs: checks
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit

  # Waits for a reviewer to approve the "production" environment in GitHub,
  # then ships the exact commit that just went to staging.
  deploy-production:
    needs: deploy-staging
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
